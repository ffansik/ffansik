<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ffansik — Links &amp; Contact</title>
  <meta name="description" content="ffansik — TikTok Producer. Official social links, direct contacts, and message form." />
  <meta name="theme-color" content="#07070a" />

  <!-- Open Graph / Link Previews -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="ffansik — Links &amp; Contact" />
  <meta property="og:description" content="TikTok Producer. Social networks, direct contacts, and quick message form." />
  <meta property="og:url" content="https://ffansik.github.io/ffansik/" />
  <meta property="og:image" content="https://github.com/ffansik.png" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="ffansik — Links &amp; Contact" />
  <meta name="twitter:description" content="TikTok Producer. Social networks, direct contacts, and quick message form." />
  <meta name="twitter:image" content="https://github.com/ffansik.png" />

  <link rel="icon" type="image/png" href="https://github.com/ffansik.png" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-color: #07070a;
      --card-bg: rgba(255, 255, 255, 0.025);
      --card-bg-hover: rgba(255, 255, 255, 0.04);
      --border-color: rgba(255, 255, 255, 0.08);
      --border-active: rgba(255, 255, 255, 0.22);
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --success: #34d399;
      --error: #f87171;
      --font-display: 'Outfit', system-ui, sans-serif;
      --font-sans: 'Space Grotesk', system-ui, sans-serif;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --transition-smooth: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      color-scheme: dark;
      -webkit-text-size-adjust: 100%;
    }

    body {
      background-color: var(--bg-color);
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(255, 255, 255, 0.06), transparent),
        radial-gradient(circle at 85% 90%, rgba(255, 255, 255, 0.03), transparent 45%);
      color: var(--text-main);
      font-family: var(--font-sans);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: clamp(20px, 4vh, 48px) clamp(14px, 3vw, 28px);
      overflow-x: hidden;
      position: relative;
      line-height: 1.5;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* Constellation canvas background */
    canvas#background-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* Bento Grid Wrapper */
    .bento-wrapper {
      width: 100%;
      max-width: 880px;
      margin: auto;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-template-areas:
        "header  header  socials"
        "contact contact socials"
        "form    form    socials";
      gap: 16px;
      position: relative;
      z-index: 10;
    }

    /* Frosted Glass Bento Card */
    .bento-card {
      position: relative;
      overflow: hidden;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      border-radius: 22px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow:
        0 12px 32px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
      transition:
        border-color 0.25s ease,
        background-color 0.25s ease,
        box-shadow 0.3s ease,
        transform 0.3s var(--ease-out);
      opacity: 0;
      transform: translateY(16px);
      animation: cardEnter 0.65s var(--ease-out) forwards;
    }

    .bento-card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(
        420px circle at var(--mx, 50%) var(--my, 50%),
        rgba(255, 255, 255, 0.065),
        transparent 60%
      );
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    @media (hover: hover) and (pointer: fine) {
      .bento-card:hover {
        border-color: var(--border-active);
        background: var(--card-bg-hover);
        box-shadow:
          0 16px 38px rgba(0, 0, 0, 0.5),
          0 0 28px rgba(255, 255, 255, 0.03),
          inset 0 1px 0 rgba(255, 255, 255, 0.12);
        transform: translateY(-2px);
      }

      .bento-card:hover::before {
        opacity: 1;
      }
    }

    @keyframes cardEnter {
      from {
        opacity: 0;
        transform: translateY(16px);
        filter: blur(4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
    }

    /* Card grid areas & staggered delays */
    .card-header {
      grid-area: header;
      flex-direction: row;
      align-items: center;
      justify-content: flex-start;
      text-align: left;
      gap: 20px;
      animation-delay: 0.04s;
    }

    .card-socials {
      grid-area: socials;
      gap: 12px;
      justify-content: flex-start;
      animation-delay: 0.12s;
    }

    .card-contacts {
      grid-area: contact;
      gap: 12px;
      animation-delay: 0.18s;
    }

    .card-form {
      grid-area: form;
      gap: 14px;
      animation-delay: 0.24s;
    }

    /* Profile details */
    .avatar-wrapper {
      position: relative;
      flex-shrink: 0;
      width: 82px;
      height: 82px;
      border-radius: 20px;
    }

    .avatar {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      border-radius: 20px;
      border: 2px solid #ffffff;
      background: #18181b;
      box-shadow: 0 0 18px rgba(255, 255, 255, 0.45);
      animation: avatarPulse 4s ease-in-out infinite alternate;
      transition: transform 0.3s var(--ease-out);
    }

    .avatar-fallback {
      position: absolute;
      inset: 0;
      border-radius: 20px;
      border: 2px solid #ffffff;
      background: #18181b;
      color: #ffffff;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 2rem;
      display: none;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 18px rgba(255, 255, 255, 0.35);
    }

    .avatar-wrapper.is-fallback .avatar {
      display: none;
    }

    .avatar-wrapper.is-fallback .avatar-fallback {
      display: flex;
    }

    @media (hover: hover) and (pointer: fine) {
      .card-header:hover .avatar {
        transform: scale(1.03);
      }
    }

    @keyframes avatarPulse {
      0% {
        box-shadow: 0 0 14px rgba(255, 255, 255, 0.38);
      }
      100% {
        box-shadow: 0 0 24px rgba(255, 255, 255, 0.65);
      }
    }

    .header-details {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      min-width: 0;
    }

    .header-details h1 {
      font-family: var(--font-display);
      font-size: clamp(1.5rem, 2.5vw, 1.85rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }

    .header-details p {
      font-size: clamp(0.85rem, 1.5vw, 0.94rem);
      color: var(--text-muted);
      margin-top: 4px;
      line-height: 1.4;
    }

    .section-title {
      font-family: var(--font-display);
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-muted);
    }

    /* Social List */
    .social-list-wrapper {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 8px;
      flex-grow: 1;
      align-content: start;
    }

    .link-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 42px;
      background: rgba(255, 255, 255, 0.015);
      border: 1px solid var(--border-color);
      padding: 10px 14px;
      border-radius: 12px;
      text-decoration: none;
      color: var(--text-main);
      font-size: 0.84rem;
      font-weight: 500;
      transition: var(--transition-smooth);
      cursor: pointer;
    }

    .link-btn-left {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }

    .link-btn-left span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .link-btn svg.brand-icon {
      width: 16px;
      height: 16px;
      fill: currentColor;
      flex-shrink: 0;
    }

    .link-btn svg.arrow-icon {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: var(--text-muted);
      stroke-width: 2;
      flex-shrink: 0;
      transition: transform 0.25s var(--ease-out), stroke 0.25s ease;
    }

    .link-btn:hover,
    .link-btn:focus-visible {
      background: #ffffff;
      color: #07070a;
      border-color: #ffffff;
      outline: none;
    }

    .link-btn:hover svg.arrow-icon,
    .link-btn:focus-visible svg.arrow-icon {
      stroke: #07070a;
      transform: translateX(3px);
    }

    .link-btn:active {
      transform: scale(0.985);
    }

    /* Contact Details */
    .contacts-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      width: 100%;
    }

    .copy-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
      min-height: 44px;
      min-width: 0;
      background: rgba(255, 255, 255, 0.01);
      border: 1px dashed var(--border-color);
      padding: 10px 14px;
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.8rem;
      color: var(--text-main);
      cursor: pointer;
      transition: var(--transition-smooth);
      text-align: right;
    }

    .copy-label {
      color: var(--text-muted);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .copy-value {
      font-weight: 500;
      overflow-wrap: anywhere;
    }

    .copy-btn:hover,
    .copy-btn:focus-visible {
      border-style: solid;
      border-color: #ffffff;
      background: rgba(255, 255, 255, 0.04);
      outline: none;
    }

    .copy-btn:active {
      transform: scale(0.99);
    }

    .copy-btn.is-copied {
      border-style: solid;
      border-color: var(--success);
      background: rgba(52, 211, 153, 0.08);
    }

    /* Bento Form */
    .contact-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    input,
    textarea {
      width: 100%;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 11px 14px;
      border-radius: 11px;
      outline: none;
      font-size: 0.86rem;
      font-family: inherit;
      transition: var(--transition-smooth);
    }

    input::placeholder,
    textarea::placeholder {
      color: #71717a;
    }

    input:focus,
    textarea:focus {
      border-color: var(--border-active);
      background: rgba(255, 255, 255, 0.045);
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.04);
    }

    textarea {
      resize: vertical;
      min-height: 76px;
      max-height: 180px;
    }

    /* Submit Button */
    .submit-btn {
      min-height: 44px;
      background: #ffffff;
      color: #07070a;
      border: none;
      padding: 11px 16px;
      border-radius: 11px;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition-smooth);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .submit-btn:hover:not(:disabled),
    .submit-btn:focus-visible:not(:disabled) {
      background: #e4e4e7;
      transform: translateY(-1px);
      outline: none;
    }

    .submit-btn:active:not(:disabled) {
      transform: scale(0.985);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Spinner */
    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(7, 7, 10, 0.2);
      border-top-color: #07070a;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Toast Alert */
    #toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }

    .toast {
      background: rgba(16, 16, 20, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 11px 16px;
      border-radius: 12px;
      font-size: 0.82rem;
      display: flex;
      align-items: center;
      gap: 9px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.55);
      transform: translateY(10px);
      opacity: 0;
      animation: toastIn 0.22s var(--ease-out) forwards;
    }

    .toast svg {
      width: 15px;
      height: 15px;
      stroke-width: 2.5;
      fill: none;
      flex-shrink: 0;
    }

    .toast--success svg {
      stroke: var(--success);
    }

    .toast--error svg {
      stroke: var(--error);
    }

    @keyframes toastIn {
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .toast.fade-out {
      animation: toastOut 0.2s ease forwards;
    }

    @keyframes toastOut {
      to {
        opacity: 0;
        transform: translateY(4px) scale(0.96);
      }
    }

    /* Large Desktop (> 1280px) */
    @media (min-width: 1280px) {
      .bento-wrapper {
        max-width: 940px;
        gap: 20px;
      }
      .bento-card {
        padding: 28px;
      }
    }

    /* Small Laptop / Landscape Tablet (769px – 960px) */
    @media (max-width: 960px) {
      .contacts-grid {
        grid-template-columns: 1fr;
      }
    }

    /* Tablet & Large Phone (481px – 768px) */
    @media (max-width: 768px) {
      .bento-wrapper {
        grid-template-columns: minmax(0, 1fr);
        grid-template-areas:
          "header"
          "socials"
          "contact"
          "form";
        max-width: 560px;
        gap: 14px;
      }

      .social-list-wrapper {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .contacts-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      input,
      textarea {
        font-size: 16px;
      }

      #toast-container {
        left: 16px;
        right: 16px;
        bottom: 16px;
        align-items: center;
      }

      .toast {
        width: 100%;
        max-width: 420px;
      }
    }

    /* Small Tablet / Narrow 2-col contact switch */
    @media (max-width: 560px) {
      .contacts-grid {
        grid-template-columns: 1fr;
      }
    }

    /* Mobile Phone (<= 480px) */
    @media (max-width: 480px) {
      .bento-wrapper {
        gap: 12px;
      }

      .bento-card {
        padding: 18px;
        border-radius: 18px;
      }

      .card-header {
        gap: 16px;
      }

      .avatar-wrapper {
        width: 68px;
        height: 68px;
        border-radius: 16px;
      }

      .avatar,
      .avatar-fallback {
        border-radius: 16px;
      }

      .social-list-wrapper {
        grid-template-columns: 1fr;
      }
    }

    /* Ultra-narrow screens (<= 340px) */
    @media (max-width: 340px) {
      .card-header {
        flex-direction: column;
        text-align: center;
      }

      .header-details {
        align-items: center;
      }
    }

    /* Accessibility: Reduced Motion */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }

      .bento-card {
        opacity: 1;
        transform: none;
        filter: none;
      }
    }
  </style>
</head>

  <!-- Toast Area -->
  <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

  <script>
    // Cloudflare Worker endpoint (keeps Telegram bot token hidden on the server side)
    const WORKER_URL = "https://ffansik-contact.mastertoibov.workers.dev";

    // Interactive glass spotlight on bento cards (desktop fine pointers)
    const canHover = window.matchMedia("(hover: hover) and (pointer: fine)").matches;
    if (canHover) {
      document.querySelectorAll(".bento-card").forEach((card) => {
        card.addEventListener("pointermove", (e) => {
          const rect = card.getBoundingClientRect();
          card.style.setProperty("--mx", `${e.clientX - rect.left}px`);
          card.style.setProperty("--my", `${e.clientY - rect.top}px`);
        });
      });
    }

    // Clipboard copy with fallback for non-HTTPS local preview
    async function copyText(value) {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(value);
        return;
      }
      const temp = document.createElement("textarea");
      temp.value = value;
      temp.setAttribute("readonly", "");
      temp.style.position = "fixed";
      temp.style.opacity = "0";
      document.body.appendChild(temp);
      temp.select();
      const ok = document.execCommand("copy");
      temp.remove();
      if (!ok) throw new Error("Copy failed");
    }

    document.querySelectorAll(".copy-btn").forEach((btn) => {
      let resetTimer = null;
      btn.addEventListener("click", async () => {
        const value = btn.dataset.copy;
        const successLabel = btn.dataset.label || "Copied";
        try {
          await copyText(value);
          showToast(successLabel, "success");
          btn.classList.add("is-copied");
          clearTimeout(resetTimer);
          resetTimer = setTimeout(() => btn.classList.remove("is-copied"), 1500);
        } catch {
          showToast("Failed to copy", "error");
        }
      });
    });

    // Safe Toast Notifications
    function showToast(message, type = "success") {
      const container = document.getElementById("toast-container");
      const toast = document.createElement("div");
      toast.className = `toast toast--${type}`;
      toast.setAttribute("role", "status");

      const svgNS = "http://www.w3.org/2000/svg";
      const svg = document.createElementNS(svgNS, "svg");
      svg.setAttribute("viewBox", "0 0 24 24");
      svg.setAttribute("aria-hidden", "true");

      if (type === "success") {
        const poly = document.createElementNS(svgNS, "polyline");
        poly.setAttribute("points", "20 6 9 17 4 12");
        svg.appendChild(poly);
      } else {
        const l1 = document.createElementNS(svgNS, "line");
        l1.setAttribute("x1", "18"); l1.setAttribute("y1", "6");
        l1.setAttribute("x2", "6");  l1.setAttribute("y2", "18");
        const l2 = document.createElementNS(svgNS, "line");
        l2.setAttribute("x1", "6");  l2.setAttribute("y1", "6");
        l2.setAttribute("x2", "18"); l2.setAttribute("y2", "18");
        svg.append(l1, l2);
      }

      const span = document.createElement("span");
      span.textContent = message;
      toast.append(svg, span);
      container.appendChild(toast);

      setTimeout(() => {
        toast.classList.add("fade-out");
        toast.addEventListener("animationend", () => toast.remove(), { once: true });
      }, 2400);
    }

    // Constellation Canvas Background (HiDPI, delta-time normalized, zero-NaN)
    const canvas = document.getElementById("background-canvas");
    const ctx = canvas.getContext("2d");
    const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

    let width = 0;
    let height = 0;
    let particles = [];
    let rafId = null;
    let lastTime = 0;

    const mouse = { x: null, y: null, radius: 130 };
    if (canHover) {
      window.addEventListener("pointermove", (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
      });
      window.addEventListener("pointerleave", () => {
        mouse.x = null;
        mouse.y = null;
      });
    }

    const config = {
      maxVelocity: 22, // px per second
      lineLength: 120,
    };

    class Particle {
      constructor() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.r = Math.random() * 1.1 + 0.9;
        this.vx = (Math.random() - 0.5) * config.maxVelocity * 2;
        this.vy = (Math.random() - 0.5) * config.maxVelocity * 2;
      }

      update(dt) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;

        if (this.x <= 0) {
          this.x = 0;
          this.vx = Math.abs(this.vx);
        } else if (this.x >= width) {
          this.x = width;
          this.vx = -Math.abs(this.vx);
        }

        if (this.y <= 0) {
          this.y = 0;
          this.vy = Math.abs(this.vy);
        } else if (this.y >= height) {
          this.y = height;
          this.vy = -Math.abs(this.vy);
        }

        if (mouse.x !== null && mouse.y !== null) {
          const dx = this.x - mouse.x;
          const dy = this.y - mouse.y;
          const dist = Math.hypot(dx, dy);
          if (dist > 0.001 && dist < mouse.radius) {
            const force = (mouse.radius - dist) / mouse.radius;
            const push = force * 42 * dt;
            this.x += (dx / dist) * push;
            this.y += (dy / dist) * push;
          }
        }
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(255, 255, 255, 0.24)";
        ctx.fill();
      }
    }

    function resizeCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      canvas.style.width = `${width}px`;
      canvas.style.height = `${height}px`;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const areaCount = Math.floor((width * height) / 22000);
      const targetCount = Math.max(24, Math.min(64, areaCount));
      particles = Array.from({ length: targetCount }, () => new Particle());
    }

    function drawFrame() {
      ctx.clearRect(0, 0, width, height);

      for (let i = 0; i < particles.length; i++) {
        const p1 = particles[i];
        p1.draw();

        for (let j = i + 1; j < particles.length; j++) {
          const p2 = particles[j];
          const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
          if (dist < config.lineLength) {
            const alpha = (1 - dist / config.lineLength) * 0.09;
            ctx.lineWidth = 0.6;
            ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.stroke();
          }
        }

        if (mouse.x !== null && mouse.y !== null) {
          const mDist = Math.hypot(mouse.x - p1.x, mouse.y - p1.y);
          if (mDist < mouse.radius) {
            const alpha = (1 - mDist / mouse.radius) * 0.14;
            ctx.lineWidth = 0.7;
            ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(mouse.x, mouse.y);
            ctx.stroke();
          }
        }
      }
    }

    function loop(timestamp) {
      const dt = lastTime ? Math.min((timestamp - lastTime) / 1000, 0.05) : 0.016;
      lastTime = timestamp;

      for (const p of particles) {
        p.update(dt);
      }
      drawFrame();
      rafId = requestAnimationFrame(loop);
    }

    resizeCanvas();
    if (prefersReducedMotion.matches) {
      drawFrame();
    } else {
      rafId = requestAnimationFrame(loop);
    }

    let resizeTimer = null;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        resizeCanvas();
        if (prefersReducedMotion.matches) drawFrame();
      }, 150);
    });

    prefersReducedMotion.addEventListener("change", (e) => {
      if (e.matches) {
        cancelAnimationFrame(rafId);
        rafId = null;
        drawFrame();
      } else if (!rafId) {
        lastTime = 0;
        rafId = requestAnimationFrame(loop);
      }
    });

    // Contact Form Submission via Cloudflare Worker
    const form = document.getElementById("contact-form");
    const nameInput = document.getElementById("name");
    const msgInput = document.getElementById("msg");
    const submitBtn = document.getElementById("submit-btn");
    const btnSpinner = document.getElementById("btn-spinner");
    const btnText = submitBtn.querySelector(".btn-text");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const name = nameInput.value.trim() || "Guest";
      const message = msgInput.value.trim();

      if (!message) {
        showToast("Please write a message first", "error");
        msgInput.focus();
        return;
      }

      if (!WORKER_URL) {
        showToast("Form endpoint is not connected yet", "error");
        return;
      }

      submitBtn.disabled = true;
      btnSpinner.style.display = "block";
      btnText.textContent = "Sending...";

      try {
        const response = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, message }),
        });

        if (!response.ok) throw new Error("Request failed");

        showToast("Message sent successfully", "success");
        form.reset();
      } catch {
        showToast("Error sending message", "error");
      } finally {
        submitBtn.disabled = false;
        btnSpinner.style.display = "none";
        btnText.textContent = "Submit Message";
      }
    });
  </script>
